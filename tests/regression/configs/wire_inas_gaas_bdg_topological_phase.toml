# U10 T2 (sibling of wire_inas_gaas_bdg_topological_2d.toml): smoke fixture
# for the config-driven writer path (T2). The wire_bdg sweep's
# eval_wire_bdg_gap fixes the FEAST window to ±5·delta_0 around E=0
# (catches near-zero Majorana-mode subspace), so mu MUST stay within
# ±0.001 eV of the conduction-band edge 0.6601 eV — values far from the
# edge leave the subspace empty and FEAST fails. This fixture keeps
# mu narrow at conduction-edge physics (0.6600..0.6602) but widens the
# B grid to nB=21 for finer B_crit transition detection. Non-flat colormap
# assertions (T4) are a separate ticket. Output files are renamed so
# neither writer collides with the canonical fixture (T2 config-driven
# writer path).
confinement = "wire"
FDorder = 2
fd_step = 1
which_band = 0
band_idx = 1

[wave_vector]
mode = "kz"
max = 0.0
nsteps = 2

[bands]
num_cb = 4
num_vb = 8

[wire]
nx = 13
ny = 13
dx = 5.0
dy = 5.0

[wire.geometry]
shape = "rectangle"
width = 65.0
height = 65.0

[[region]]
material = "GaAs"
inner = 25.0
outer = 65.0

[[region]]
material = "InAs"
inner = 0.0
outer = 25.0

[strain]
reference = "GaAs"
solver = "pardiso"
piezoelectric = false

[bdg]
mu = 0.6601
delta_0 = 0.0002
kz = 0.0
B_vec = [0.0, 0.0, 0.0]
g_factor = 15.0

[topology]
mode = "sweep"
sweep_model = "wire_bdg"
gap_sweep_B_min = 0.0
gap_sweep_B_max = 5.0
gap_sweep_nB = 6
gap_sweep_mu_min = 0.6600
gap_sweep_mu_max = 0.6602
gap_sweep_nMu = 3
compute_gap_sweep = true
phase_diagram_file = "z2_phase_diagram_phase.dat"
slim_pfaffian_witness_file = "wire_slim_pfaffian_witness_phase.dat"

[solver]
method = "FEAST"
mode = "ENERGY"
emin = -0.005
emax = 0.005
m0 = 128